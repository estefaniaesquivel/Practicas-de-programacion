<!DOCTYPE html>
<html>
    <head>
        <title>Tablas</title>

    </head>
    <body>

        <table border="1" cellpadding="10" cellspacing="0">
    
        <thead>
            <tr>
                <th colspan="4">Rangos de presión arterial por edad y sexo</th>
            </tr>
            <tr>
                <th>Grupo de Edad</th>
                <th>Sexo</th>
                <th>Sistólica (mmHg)</th>
                <th>Diastólica (mmHg)</th>
            </tr>
        </thead>
        <tbody>
       
            <tr>
            
                <td rowspan="2">Jóvenes (18 - 30 años)</td>
                <td>Hombre</td>
                <td>Menor a 120</td>
                <td>Menor a 80</td>
            </tr>
            <tr>
            
                <td>Mujer</td>
                <td>Menor a 115</td>
                <td>Menor a 75</td>
            </tr>

        
            <tr>
                <td rowspan="2">Adultos (31 - 59 años)</td>
                <td>Hombre</td>
                <td>120 - 129</td>
                <td>80 - 84</td>
            </tr>
            <tr>
                <td>Mujer</td>
                <td>118 - 125</td>
                <td>78 - 82</td>
            </tr>
            </tbody>
        </table>


    </body>

</html>
